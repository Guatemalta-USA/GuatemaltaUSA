<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guatemalta USA</title>
    <meta name="description" content="Learn more about Guatemalta USA and our team">
    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Guatemalta USA",
        "url": "https://guatemaltausa.org",
        "logo": "https://raw.githubusercontent.com/Guatemalta-USA/GuatemaltaUSA/refs/heads/main/images/logo.png",
        "description": "Building a bridge of hope to Guatemala through sustainable housing, clean water, and educational opportunities."
        }
    </script>
    <meta property="og:title" content="Guatemalta USA">
    <meta property="og:description"
        content="Building a bridge of hope to Guatemala through sustainable housing, clean water, and educational opportunities.">
    <meta property="og:image"
        content="https://raw.githubusercontent.com/Guatemalta-USA/GuatemaltaUSA/refs/heads/main/images/logo.png">
    <meta property="og:url" content="https://guatemaltausa.org">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="images/icon-only.png" type="images/x-icon">
</head>

<body>
    <button id="mobile-nav-toggle" class="material-symbols-outlined">
        menu
    </button>
    <a href="#maincontent" class="skip-link" data-i18n="screen_reader_skip">Skip to main content</a>
    <div id="page-wrapper">
        <header></header>
        <nav></nav>
        <section class="message-wrapper" id="main-message"></section>
        <main id="maincontent">
            <div class="container">
                <div id="loading">
                    <div class="loader"></div>
                    <h2>Loading...</h2>
                </div>
                <div id="view-section">
                    <div id="content-display" class="ql-snow ql-editor">
                    </div>
                </div>
                <div id="admin-controls" class="hide"></div>

                <div id="edit-section" class="hide">
                    <div id="editor-container" style="height: 300px;"></div>
                    <div class="actions">
                        <button id="cancel-btn" class="accent-button">Cancel</button>
                        <button id="save-btn" class="accent-button">Save & Close</button>
                    </div>
                </div>
            </div>
            <div id="profiles-section"></div>
            <form id="contact-form" class="container hide">
                <h2>Contact Us</h2>
                <div class="form-row">
                    <label for="entry.1134764317">Your Name:</label>
                    <input type="text" id="entry.1134764317" name="entry.1134764317" />
                </div>
                <div class="form-row">
                    <label for="entry.1281748752">Your Email:</label>
                    <input type="text" id="entry.1281748752" name="entry.1281748752" />
                </div>
                <div class="form-row">
                    <label for="entry.1027877017">Comments:</label>
                    <textarea type="text" id="entry.1027877017" name="entry.1027877017"></textarea>
                </div>
                <div class="button-row">
                    <button type="reset" id="reset" class="accent-button">Reset Form</button>
                    <button type="submit" id="submit" class="accent-button">Submit</button>
                </div>
            </form>
        </main>
        <footer></footer>
    </div>
    <div id="modal-root" class="hide">
        <div class="modal-overlay">
            <div class="modal-content">
                <h2>Add Team Member</h2>
                <form id="add-profile-form">
                    <input type="text" id="p-name" placeholder="First Name" />
                    <input type="text" id="p-position" placeholder="Position" />
                    <input type="email" id="p-email" placeholder="Email" />
                    <select name="country" id="country">
                        <option disabled selected>Select Country...</option>
                        <option value="usa">USA</option>
                        <option value="guatemala">Guatemala</option>
                    </select>
                    <textarea id="p-about" placeholder="About bio..."></textarea>

                    <label for="p-image">Profile Photo:</label>
                    <input type="file" id="p-image" accept="image/*" />

                    <div class="button-row">
                        <button type="button" id="close-modal" class="accent-button">Cancel</button>
                        <button type="submit" id="save-profile" class="accent-button">Save Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script type="module" src="src/about"></script>
</body>

</html>
