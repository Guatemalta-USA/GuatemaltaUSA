<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guatemalta USA</title>
    <meta name="description"
        content="Stay updated on our latest projects and success stories. Sign up for the Guatemalta USA mailing list to see the direct impact of your support.">
    <script type="application/ld+json">
        {
        "@context": "https://schema.org",
        "@type": "NGO",
        "name": "Guatemalta USA",
        "url": "https://guatemaltausa.org",
        "logo": "https://raw.githubusercontent.com/Guatemalta-USA/GuatemaltaUSA/refs/heads/main/images/logo.png",
        "description": "Building a bridge of hope to Guatemala through sustainable housing, clean water, and educational opportunities."
        }
    </script>
    <meta property="og:title" content="Guatemalta USA">
    <meta property="og:description"
        content="Building a bridge of hope to Guatemala through sustainable housing, clean water, and educational opportunities.">
    <meta property="og:image"
        content="https://raw.githubusercontent.com/Guatemalta-USA/GuatemaltaUSA/refs/heads/main/images/logo.png">
    <meta property="og:url" content="https://guatemaltausa.org">
    <meta name="twitter:card" content="summary_large_image">
    <link href="../src/css/style.css" rel="stylesheet" />
    <link href="../src/css/grid.css" rel="stylesheet" />
    <link href="../src/css/form.css" rel="stylesheet" />
    <link href="../src/css/quill.css" rel="stylesheet" />
    <link rel="icon" href="../images/icon-only.png" type="images/x-icon">
</head>

<body>
    <button id="mobile-nav-toggle" class="material-symbols-outlined">
        menu
    </button>
    <a href="#maincontent" class="skip-link" data-i18n="screen_reader_skip">Skip to main content</a>
    <div id="page-wrapper">
        <header></header>
        <nav></nav>
        <section class="message-wrapper" id="main-message"></section>
        <main id="maincontent">
            <div class="container">
                <div id="loading">
                    <div class="loader"></div>
                    <h2>Loading...</h2>
                </div>
                <div id="admin-controls" class="hide"></div>
                <div id="edit-section" class="">
                    <div id="project-details">
                        <input type="text" placeholder="Project Title" name="project-title-input"
                            id="project-title-input" />
                        <label class="switch">
                            <input type="checkbox" id="project-status-toggle" checked>
                            <span class="slider round"></span>
                        </label>
                        <span id="current-status-label">Current Project</span>

                        <label class="switch">
                            <input type="checkbox" id="published-toggle">
                            <span class="slider round"></span>
                        </label>
                        <span id="published-label">Unpublished</span>



                        
                    </div>
                    <div id="editor-container" style="height: 300px;"></div>
                    <div class="actions">
                        <button id="delete-post-btn" class="accent-button">
                            <span class="material-symbols-outlined">delete</span> Delete Project</button>
                        <button id="save-btn" class="accent-button">
                            <span class="material-symbols-outlined">save</span> Save Project</button>
                    </div>
                </div>
            </div>

        </main>
        <footer></footer>
    </div>
    <script type="module" src="../src/editProject"></script>
</body>

</html>
